<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Camino Al Inconsciente</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              400: '#facc15',
              500: '#eab308',
              600: '#ca8a04',
            }
          }
        }
      }
    }
  </script>

  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel para compilar JSX -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;

    .font-cinzel {
      font-family: 'Cinzel', serif;

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;

    ::-webkit-scrollbar-thumb:hover {

</head>
<body class="bg-slate-950 text-slate-100 w-full h-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Componente del Logo Oficial Exacto de Camino Al Inconsciente
    function CaminoLogo({ className = "w-full max-w-sm" }) {
      return (
        <div className={`flex flex-col items-center text-center justify-center p-2 ${className}`}>
          <svg viewBox="0 0 500 450" className="w-full h-auto drop-shadow-[0_0_20px_rgba(234,179,8,0.25)]" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor="#fff" stopOpacity="1"/>
                <stop offset="30%" stopColor="#fbbf24" stopOpacity="0.8"/>
                <stop offset="70%" stopColor="#d97706" stopOpacity="0.3"/>
                <stop offset="100%" stopColor="#000" stopOpacity="0"/>
              </radialGradient>
              
              <linearGradient id="pathGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stopColor="#b45309" />
                <stop offset="40%" stopColor="#f59e0b" />
                <stop offset="80%" stopColor="#fef08a" />
                <stop offset="100%" stopColor="#ffffff" />
              </linearGradient>

              <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#fef08a" />
                <stop offset="50%" stopColor="#eab308" />
                <stop offset="100%" stopColor="#ca8a04" />
              </linearGradient>
            </defs>

            <circle cx="250" cy="110" r="90" fill="url(#starGlow)"/>
            <circle cx="250" cy="150" r="115" fill="none" stroke="#d97706" strokeWidth="2" strokeDasharray="4 2" opacity="0.6"/>
            <circle cx="250" cy="150" r="110" fill="none" stroke="#f59e0b" strokeWidth="2" opacity="0.8"/>

            <g transform="translate(250, 60)">
              <polygon points="0,-25 5,-5 25,0 5,5 0,25 -5,5 -25,0 -5,-5" fill="#ffffff" />
              <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#fef08a" />
            </g>

            <path d="M160 210 L180 180 L195 220 L175 235 Z" fill="#1e293b" stroke="#d97706" strokeWidth="1.5" />
            <path d="M140 230 L165 195 L180 240 L150 250 Z" fill="#0f172a" stroke="#b45309" strokeWidth="1" />
            <path d="M340 210 L320 180 L305 220 L325 235 Z" fill="#1e293b" stroke="#d97706" strokeWidth="1.5" />
            <path d="M360 230 L335 195 L320 240 L350 250 Z" fill="#0f172a" stroke="#b45309" strokeWidth="1" />

            <path d="M 220 250 Q 250 220 235 180 Q 225 150 250 60 Q 255 150 265 180 Q 250 220 280 250 Z" fill="url(#pathGrad)" />

            <g transform="translate(242, 110)">
              <circle cx="8" cy="0" r="6" fill="#0b0f19" stroke="#fef08a" strokeWidth="1.5"/>
              <path d="M8 6 L12 25 L18 42 M8 12 L0 25 M8 12 L18 20 M12 25 L4 42" fill="none" stroke="#0b0f19" strokeWidth="4" strokeLinecap="round"/>
              <path d="M8 6 L12 25 L18 42 M8 12 L0 25 M8 12 L18 20 M12 25 L4 42" fill="none" stroke="#fef08a" strokeWidth="2" strokeLinecap="round"/>
            </g>

            <text x="250" y="295" textAnchor="middle" fill="url(#goldTextGrad)" fontFamily="Cinzel, serif" fontSize="28" fontWeight="bold" letterSpacing="4">
              CAMINO AL
            </text>

            <text x="250" y="340" textAnchor="middle" fill="#fef08a" fontFamily="Cinzel, serif" fontSize="40" fontWeight="bold" letterSpacing="6">
              INCONSCIENTE
            </text>

            <line x1="80" y1="362" x2="190" y2="362" stroke="#d97706" strokeWidth="1.5"/>
            <circle cx="250" cy="362" r="3" fill="#fef08a"/>
            <line x1="310" y1="362" x2="420" y2="362" stroke="#d97706" strokeWidth="1.5"/>

            <text x="250" y="380" textAnchor="middle" fill="#fef08a" fontFamily="Cinzel, serif" fontSize="16" letterSpacing="8">
              BIODESCODIFICACIÓN
            </text>

            <text x="250" y="415" textAnchor="middle" fill="#94a3b8" fontFamily="Plus Jakarta Sans, sans-serif" fontSize="11" letterSpacing="3">
              ROMPE TUS LÍMITES. TRANSFORMA TU VIDA.
            </text>
          </svg>
        </div>
      );
    }

    // Base de datos de Patologías (PES)
    const BANCO_PES = [
      { id: 1, nombre: "Acné", organo: "Glándulas sebáceas de la piel", capa: "Ectodermo", conflicto: "Separación estética o desvalorización de la imagen.", fase: "Vagotónica (fase de reparación, con inflamación y pus)." },
      { id: 2, nombre: "Adenoma", organo: "Glándulas (hipófisis, tiroides, etc.)", capa: "Endodermo / Mesodermo", conflicto: "No sentirse suficientemente capaz, rápido o apto.", fase: "Vagotónica (proliferación benigna en reparación)." },
      { id: 3, nombre: "Afonía", organo: "Cuerdas vocales, laringe", capa: "Ectodermo", conflicto: "Miedo en el territorio o no poder expresarse.", fase: "Simpaticotónica o Vagotónica (inflamación/ronquera)." },
      { id: 4, nombre: "Alergia", organo: "Piel, mucosas, sistema inmune", capa: "Ectodermo", conflicto: "Separación o invasión del territorio.", fase: "Vagotónica (inflamación por contacto con el alérgeno)." },
      { id: 5, nombre: "Amigdalitis", organo: "Amígdalas", capa: "Endodermo", conflicto: "No poder tragar una situación injusta, ofensa o humillación.", fase: "Vagotónica (dolor e inflamación al resolver)." },
      { id: 6, nombre: "Anemia", organo: "Médula ósea roja", capa: "Mesodermo Nuevo", conflicto: "Desvalorización profunda sobre uno mismo.", fase: "Simpaticotónica (reducción de glóbulos rojos)." },
      { id: 7, nombre: "Angina de pecho", organo: "Músculo cardíaco y arterias coronarias", capa: "Ectodermo / Mesodermo", conflicto: "Pérdida territorial o amenaza al territorio.", fase: "Simpaticotónica (dolor y constricción durante el conflicto)." },
      { id: 8, nombre: "Anorexia", organo: "Hipotálamo / sistema digestivo", capa: "Ectodermo / Endodermo", conflicto: "Deseo de control, rechazo materno o del crecimiento.", fase: "Simpaticotónica (falta de apetito, hipervigilancia)." },
      { id: 9, nombre: "Apendicitis", organo: "Apéndice (intestino grueso)", capa: "Endodermo", conflicto: "No poder evacuar una situación sucia o repugnante.", fase: "Vagotónica (inflamación aguda en reparación)." },
      { id: 10, nombre: "Asma", organo: "Bronquios", capa: "Ectodermo", conflicto: "Miedo en el territorio, opresión, falta de espacio.", fase: "Vagotónica (espasmos y dificultad para respirar)." },
      { id: 11, nombre: "Bronquitis", organo: "Bronquios", capa: "Ectodermo", conflicto: "Conflicto de territorio o miedo a perderlo.", fase: "Vagotónica (inflamación de los bronquios)." },
      { id: 12, nombre: "Bruxismo", organo: "Músculos mandibulares", capa: "Mesodermo Nuevo", conflicto: "Impotencia o rabia contenida, necesidad de control.", fase: "Simpaticotónica (tensión muscular prolongada)." },
      { id: 13, nombre: "Cáncer de pulmón", organo: "Alvéolos pulmonares", capa: "Endodermo", conflicto: "Miedo a morir por asfixia o pérdida de espacio vital.", fase: "Simpaticotónica (proliferación celular)." },
      { id: 14, nombre: "Cáncer de mama", organo: "Glándulas mamarias o conductos", capa: "Endodermo / Ectodermo", conflicto: "Preocupación por el nido o conflicto de separación.", fase: "Simpaticotónica o Vagotónica según tejido." },
      { id: 15, nombre: "Colon Irritable", organo: "Colon / Intestino delgado", capa: "Endodermo", conflicto: "Conflicto de control emocional o experiencias indigeribles.", fase: "Fase oscilante por recaídas constantes." },
      { id: 16, nombre: "Dermatitis", organo: "Piel (epidermis)", capa: "Ectodermo", conflicto: "Conflicto de separación o contacto no deseado.", fase: "Vagotónica (inflamación, picazón y enrojecimiento)." },
      { id: 17, nombre: "Diabetes tipo 2", organo: "Páncreas y receptores celulares", capa: "Endodermo / Mesodermo", conflicto: "Resistencia al cambio, frustración o defensa frente al entorno.", fase: "Fase prolongada adaptativa." },
      { id: 18, nombre: "Gastritis", organo: "Estómago", capa: "Endodermo", conflicto: "Situación indigesta, vivencia de injusticia o contrariedad.", fase: "Vagotónica (dolor e inflamación durante la curación)." },
      { id: 19, nombre: "Herpes labial", organo: "Labios", capa: "Ectodermo", conflicto: "Conflicto de separación o contacto prohibido/desagradable.", fase: "Vagotónica (vesículas y dolor en reparación)." },
      { id: 20, nombre: "Hipertensión arterial", organo: "Arterias / corazón", capa: "Mesodermo Nuevo", conflicto: "Conflicto de sobrecarga, resistencia o presión emocional.", fase: "Simpaticotónica (presión elevada adaptativa)." },
      { id: 21, nombre: "Insomnio", organo: "Sistema nervioso central", capa: "Ectodermo", conflicto: "Hiperalerta, miedo nocturno o estado de peligro sostenido.", fase: "Simpaticotónica (imposibilidad de relajación)." },
      { id: 22, nombre: "Migraña", organo: "Cerebro / vasos sanguíneos", capa: "Ectodermo", conflicto: "Conflicto de control, desvalorización intelectual o sobrecarga.", fase: "Vagotónica (congestión y dolor durante reparación)." },
      { id: 23, nombre: "Psoriasis", organo: "Piel (epidermis)", capa: "Ectodermo", conflicto: "Doble conflicto de separación (querer y no querer contacto).", fase: "Fase activa y de reparación simultánea." },
      { id: 24, nombre: "Rosácea", organo: "Piel del rostro", capa: "Ectodermo", conflicto: "Conflicto de vergüenza, exposición no deseada o ataque a la cara.", fase: "Vagotónica (enrojecimiento como reparación)." },
      { id: 25, nombre: "Sinusitis", organo: "Senos paranasales", capa: "Endodermo", conflicto: "Presentimiento de peligro o situación que 'huele mal'.", fase: "Vagotónica (inflamación y congestión)." },
      { id: 26, nombre: "Tendinitis", organo: "Tendones", capa: "Mesodermo Nuevo", conflicto: "Desvalorización por acción forzada o imposibilidad de ejecutar.", fase: "Vagotónica (inflamación dolorosa en curación)." },
      { id: 27, nombre: "Tiroides (Hipotiroidismo)", organo: "Glándula Tiroides", capa: "Endodermo", conflicto: "Sentirse impotente ante la velocidad del tiempo; querer frenar.", fase: "Vagotónica (ralentización metabólica)." },
      { id: 28, nombre: "Úlcera gástrica", organo: "Estómago", capa: "Endodermo", conflicto: "Contrariedad indigesta territorial con rabia o rencor.", fase: "Simpaticotónica (ulceración activa)." },
      { id: 29, nombre: "Várices", organo: "Venas", capa: "Mesodermo Nuevo", conflicto: "Sentirse atado a una situación, llevar una bola de hierro.", fase: "Vagotónica (dilatación venosa)." },
      { id: 30, nombre: "Zona (Herpes Zóster)", organo: "Piel y nervios", capa: "Ectodermo", conflicto: "Separación brutal, contacto muy sucio o agresión en la zona.", fase: "Vagotónica (ampollas dolorosas en trayecto nervioso)." }
    ];

    function App() {
      const [tab, setTab] = useState('escaner');

      const [paso, setPaso] = useState(1);
      const [sintoma, setSintoma] = useState('');
      const [tiempo, setTiempo] = useState('1 a 6 meses');
      const [intensidad, setIntensidad] = useState(7);
      const [evento, setEvento] = useState('');
      const [sensacion, setSensacion] = useState('Impotencia / No poder actuar');
      const [repetitivo, setRepetitivo] = useState('Sí');
      const [compromiso, setCompromiso] = useState(8);

      const [busqueda, setBusqueda] = useState('');
      const [capaFiltro, setCapaFiltro] = useState('TODAS');
      const [paginaActual, setPaginaActual] = useState(1);
      const itemsPorPagina = 6;

      const PHONE_NUMBER = "56990229732";

      useEffect(() => {
        const savedSintoma = localStorage.getItem('camino_sintoma');
        if (savedSintoma) setSintoma(savedSintoma);
      }, []);

      useEffect(() => {
        localStorage.setItem('camino_sintoma', sintoma);
      }, [sintoma]);

      const receptividad = useMemo(() => {
        let score = 40;
        if (parseInt(intensidad) > 6) score += 20;
        if (evento.length > 10) score += 20;
        if (parseInt(compromiso) > 7) score += 20;
        return Math.min(score, 100);
      }, [intensidad, evento, compromiso]);

      const listaFiltrada = useMemo(() => {
        return BANCO_PES.filter(item => {
          const coincideTexto = item.nombre.toLowerCase().includes(busqueda.toLowerCase()) || 
                                item.conflicto.toLowerCase().includes(busqueda.toLowerCase()) ||
                                item.organo.toLowerCase().includes(busqueda.toLowerCase());
          
          const coincideCapa = capaFiltro === 'TODAS' || item.capa.toLowerCase().includes(capaFiltro.toLowerCase());

          return coincideTexto && coincideCapa;
        });
      }, [busqueda, capaFiltro]);

      const totalPaginas = Math.ceil(listaFiltrada.length / itemsPorPagina) || 1;
      const itemsPaginados = useMemo(() => {
        const inicio = (paginaActual - 1) * itemsPorPagina;
        return listaFiltrada.slice(inicio, inicio + itemsPorPagina);
      }, [listaFiltrada, paginaActual]);

      const evaluarEnEscaner = (nombreSintoma) => {
        setSintoma(nombreSintoma);
        setTab('escaner');
        setPaso(1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const enviarWhatsApp = () => {
        const text = `*FICHA DE ESCÁNER BIOEMOCIONAL - CAMINO AL INCONSCIENTE*%0A%0A` +
          `*1. Síntoma / Conflicto:* ${sintoma || 'No especificado'}%0A` +
          `*2. Duración:* ${tiempo}%0A` +
          `*3. Nivel de Estrés:* ${intensidad}/10%0A` +
          `*4. Evento / Bioshock:* ${evento || 'No detallado'}%0A` +
          `*5. Sentimiento Predominante:* ${sensacion}%0A` +
          `*6. Patrón Repetitivo:* ${repetitivo}%0A` +
          `*7. Compromiso de Cambio:* ${compromiso}/10%0A` +
          `*8. Índice de Receptividad:* ${receptividad}%25%0A%0A` +
          `Hola Mario, he completado mi Escáner Bioemocional en el portal y deseo coordinar mi sesión privada 1 a 1.`;
        
        window.open(`https://wa.me/${PHONE_NUMBER}?text=${text}`, '_blank');
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          
          <header className="mb-8 flex flex-col items-center">
            <a href="https://caminoalinconsciente.cl/" target="_blank" rel="noopener noreferrer" className="transition-transform hover:scale-105">
              <CaminoLogo className="w-full max-w-md" />
            </a>
          </header>

          <div className="flex justify-center mb-8 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800 max-w-md mx-auto shadow-lg">
            <button
              onClick={() => setTab('escaner')}
              className={`flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2 ${
                tab === 'escaner'
                  ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md shadow-amber-500/20'
                  : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>✨</span> Escáner Bioemocional
            </button>
            <button
              onClick={() => setTab('diccionario')}
              className={`flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2 ${
                tab === 'diccionario'
                  ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md shadow-amber-500/20'
                  : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span>📖</span> Diccionario PES
            </button>
          </div>

          {tab === 'escaner' && (
            <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm">
              
              <div className="mb-8">
                <div className="flex justify-between text-xs font-semibold text-amber-400/80 uppercase tracking-widest mb-2">
                  <span>Paso {paso} de 4</span>
                  <span>{paso * 25}% Completado</span>
                </div>
                <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                  <div 
                    className="bg-gradient-to-r from-amber-500 to-yellow-300 h-full transition-all duration-500 ease-out"
                    style={{ width: `${paso * 25}%` }}
                  ></div>
                </div>
              </div>

              {paso === 1 && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-slate-100 flex items-center gap-2">
                    <span className="text-amber-400">1.</span> Identificación del Síntoma o Conflicto
                  </h2>
                  <p className="text-sm text-slate-400">
                    Escribe el síntoma físico, molestia u obstáculo emocional que deseas comprender.
                  </p>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">
                      Síntoma o Situación de Estrés
                    </label>
                    <input
                      type="text"
                      value={sintoma}
                      onChange={(e) => setSintoma(e.target.value)}
                      placeholder="Ej: Colon irritable, migraña, dificultad económica..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">
                      ¿Hace cuánto tiempo se manifiesta?
                    </label>
                    <select
                      value={tiempo}
                      onChange={(e) => setTiempo(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500"
                    >
                      <option>Menos de 1 mes</option>
                      <option>1 a 6 meses</option>
                      <option>6 meses a 2 años</option>
                      <option>Más de 2 años (crónico)</option>
                    </select>
                  </div>

                  <button
                    disabled={!sintoma.trim()}
                    onClick={() => setPaso(2)}
                    className="w-full py-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    Siguiente Paso →
                  </button>
                </div>
              )}

              {paso === 2 && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-slate-100 flex items-center gap-2">
                    <span className="text-amber-400">2.</span> Intensidad del Estrés e Impacto
                  </h2>
                  
                  <div>
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-xs font-medium text-slate-300 uppercase tracking-wider">
                        Nivel de estrés de 1 a 10
                      </label>
                      <span className="text-amber-400 font-bold text-lg">{intensidad}/10</span>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="10"
                      value={intensidad}
                      onChange={(e) => setIntensidad(e.target.value)}
                      className="w-full accent-amber-500 cursor-pointer h-2 bg-slate-800 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">
                      ¿Qué ocurrió cuando comenzó o empeoró el síntoma? (Bioshock)
                    </label>
                    <textarea
                      value={evento}
                      onChange={(e) => setEvento(e.target.value)}
                      rows="3"
                      placeholder="Describe brevemente el evento imprevisto o la emoción no expresada..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500"
                    ></textarea>
                  </div>

                  <div className="flex gap-4">
                    <button
                      onClick={() => setPaso(1)}
                      className="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl"
                    >
                      ← Atrás
                    </button>
                    <button
                      onClick={() => setPaso(3)}
                      className="flex-2 py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl px-8"
                    >
                      Siguiente Paso →
                    </button>
                  </div>
                </div>
              )}

              {paso === 3 && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-slate-100 flex items-center gap-2">
                    <span className="text-amber-400">3.</span> Vivencia Emocional e Inconsciente
                  </h2>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">
                      Sentimiento predominante inconsciente
                    </label>
                    <select
                      value={sensacion}
                      onChange={(e) => setSensacion(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500"
                    >
                      <option>Impotencia / No poder actuar</option>
                      <option>Miedo o amenaza en el territorio</option>
                      <option>Desvalorización personal</option>
                      <option>Separación / Pérdida de contacto</option>
                      <option>Situación sucia o indigerible</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">
                      ¿Sientes que este patrón se ha repetido en tu historia personal o familiar?
                    </label>
                    <div className="flex gap-4">
                      {['Sí', 'No', 'No estoy seguro/a'].map((op) => (
                        <button
                          key={op}
                          type="button"
                          onClick={() => setRepetitivo(op)}
                          className={`flex-1 py-3 rounded-xl border text-sm font-semibold transition-all ${
                            repetitivo === op
                              ? 'border-amber-500 bg-amber-500/10 text-amber-400'
                              : 'border-slate-800 bg-slate-950 text-slate-400'
                          }`}
                        >
                          {op}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex gap-4">
                    <button
                      onClick={() => setPaso(2)}
                      className="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl"
                    >
                      ← Atrás
                    </button>
                    <button
                      onClick={() => setPaso(4)}
                      className="flex-2 py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl px-8"
                    >
                      Ver Diagnóstico Bioemocional →
                    </button>
                  </div>
                </div>
              )}

              {paso === 4 && (
                <div className="space-y-6 text-center">
                  <div className="inline-block p-4 bg-amber-500/10 rounded-full text-amber-400 mb-2">
                    <span className="text-4xl">✨</span>
                  </div>

                  <h2 className="text-2xl font-cinzel font-bold text-amber-400">
                    Escaneo Bioemocional Completado
                  </h2>

                  <div className="bg-slate-950 border border-amber-500/30 rounded-2xl p-6 text-left space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                      <span className="text-slate-400 text-sm">Índice de Receptividad Bioemocional</span>
                      <span className="text-2xl font-bold text-amber-400">{receptividad}%</span>
                    </div>

                    <div className="space-y-2 text-sm text-slate-300">
                      <p><strong className="text-slate-100">Síntoma:</strong> {sintoma}</p>
                      <p><strong className="text-slate-100">Tiempo:</strong> {tiempo}</p>
                      <p><strong className="text-slate-100">Nivel de Estrés:</strong> {intensidad}/10</p>
                      <p><strong className="text-slate-100">Vivencia:</strong> {sensacion}</p>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-4 pt-2">
                    <button
                      onClick={enviarWhatsApp}
                      className="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                    >
                      <span>💬</span> Enviar Ficha por WhatsApp
                    </button>

                    <a
                      href="https://caminoalinconsciente.cl/"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl transition-all flex items-center justify-center gap-2 border border-slate-700"
                    >
                      <span>🔗</span> Ir a Camino Al Inconsciente
                    </a>
                  </div>

                  <button
                    onClick={() => setPaso(1)}
                    className="text-xs text-slate-500 hover:text-slate-400 underline pt-4 block mx-auto"
                  >
                    Realizar otro Escaneo
                  </button>
                </div>
              )}

            </div>
          )}

          {tab === 'diccionario' && (
            <div className="space-y-6">
              
              <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 space-y-4 backdrop-blur-sm">
                <div>
                  <input
                    type="text"
                    value={busqueda}
                    onChange={(e) => { setBusqueda(e.target.value); setPaginaActual(1); }}
                    placeholder="Buscar por síntoma, órgano o conflicto (ej: Colon, Miedo, Piel)..."
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500"
                  />
                </div>

                <div className="flex flex-wrap gap-2 pt-2">
                  {['TODAS', 'Endodermo', 'Mesodermo', 'Ectodermo'].map((capa) => (
                    <button
                      key={capa}
                      onClick={() => { setCapaFiltro(capa); setPaginaActual(1); }}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                        capaFiltro === capa
                          ? 'bg-amber-500 text-slate-950'
                          : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                      }`}
                    >
                      {capa}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {itemsPaginados.map((item) => (
                  <div key={item.id} className="bg-slate-900/80 border border-slate-800 hover:border-amber-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300">
                    <div className="space-y-3">
                      <div className="flex justify-between items-start">
                        <h3 className="text-lg font-bold text-amber-400">{item.nombre}</h3>
                        <span className="text-[10px] uppercase font-bold bg-amber-500/10 text-amber-300 border border-amber-500/20 px-2 py-0.5 rounded-md">
                          {item.capa}
                        </span>
                      </div>

                      <p className="text-xs text-slate-400">
                        <strong className="text-slate-300">Órgano:</strong> {item.organo}
                      </p>

                      <p className="text-sm text-slate-200 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                        <strong className="text-amber-400/90 block mb-1 text-xs uppercase tracking-wider">Conflicto Psicológico:</strong>
                        {item.conflicto}
                      </p>

                      <p className="text-xs text-slate-400">
                        <strong className="text-slate-300">Fase del Síntoma:</strong> {item.fase}
                      </p>
                    </div>

                    <div className="pt-4 mt-2 border-t border-slate-800/80">
                      <button
                        onClick={() => evaluarEnEscaner(item.nombre)}
                        className="w-full py-2.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-400 font-semibold rounded-xl text-xs transition-all flex items-center justify-center gap-2"
                      >
                        Evaluar en Escáner Bioemocional →
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              {totalPaginas > 1 && (
                <div className="flex justify-center items-center gap-2 pt-6">
                  <button
                    disabled={paginaActual === 1}
                    onClick={() => setPaginaActual(p => Math.max(p - 1, 1))}
                    className="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold disabled:opacity-40"
                  >
                    Anterior
                  </button>
                  <span className="text-xs text-slate-400 px-3">
                    Página {paginaActual} de {totalPaginas}
                  </span>
                  <button
                    disabled={paginaActual === totalPaginas}
                    onClick={() => setPaginaActual(p => Math.min(p + 1, totalPaginas))}
                    className="px-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs font-semibold disabled:opacity-40"
                  >
                    Siguiente
                  </button>
                </div>
              )}

            </div>
          )}

          <footer className="mt-16 text-center border-t border-slate-800/80 pt-8 pb-4">
            <CaminoLogo className="w-full max-w-xs mx-auto mb-4 opacity-80" />
            <p className="text-xs text-slate-500">
              © {new Date().getFullYear()} Camino Al Inconsciente - Mario Paredes. Todos los derechos reservados.
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
