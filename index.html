                    <select
                      value={sensacion}
                      onChange={(e) => setSensacion(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500"
                    >
                      <option>Impotencia / No poder actuar</option>
                      <option>Miedo o amenaza en el territorio</option>
                      <option>Desvalorización personal</option>
                      <option>Separación / Pérdida de contacto</option>
                      <option>Situación sucia o indigerible</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">
                      ¿Sientes que este patrón se ha repetido en tu historia personal o familiar?
                    </label>
                    <div className="flex gap-4">
                      {['Sí', 'No', 'No estoy seguro/a'].map((op) => (
                        <button
                          key={op}
                          type="button"
                          onClick={() => setRepetitivo(op)}
                          className={`flex-1 py-3 rounded-xl border text-sm font-semibold transition-all ${
                            repetitivo === op
                              ? 'border-amber-500 bg-amber-500/10 text-amber-400'
                              : 'border-slate-800 bg-slate-950 text-slate-400'
                          }`}
                        >
                          {op}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex gap-4">
                    <button
                      onClick={() => setPaso(2)}
                      className="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl"
                    >
                      ← Atrás
                    </button>
                    <button
                      onClick={() => setPaso(4)}
                      className="flex-2 py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl px-8"
                    >
                      Ver Diagnóstico Bioemocional →
                    </button>
                  </div>
                </div>
              )}

              {paso === 4 && (
                <div className="space-y-6 text-center">
                  <div className="inline-block p-4 bg-amber-500/10 rounded-full text-amber-400 mb-2">
                    <span className="text-4xl">✨</span>
                  </div>

                  <h2 className="text-2xl font-cinzel font-bold text-amber-400">
                    Escaneo Bioemocional Completado
                  </h2>

                  <div className="bg-slate-950 border border-amber-500/30 rounded-2xl p-6 text-left space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                      <span className="text-slate-400 text-sm">Índice de Receptividad Bioemocional</span>
                      <span className="text-2xl font-bold text-amber-400">{receptividad}%</span>
                    </div>

                    <div className="space-y-2 text-sm text-slate-300">
                      <p><strong className="text-slate-100">Síntoma:</strong> {sintoma}</p>
                      <p><strong className="text-slate-100">Tiempo:</strong> {tiempo}</p>
                      <p><strong className="text-slate-100">Nivel de Estrés:</strong> {intensidad}/10</p>
                      <p><strong className="text-slate-100">Vivencia:</strong> {sensacion}</p>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-4 pt-2">
                    <button
                      onClick={enviarWhatsApp}
                      className="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                    >
                      <span>💬</span> Enviar Ficha por WhatsApp
                    </button>

                    <a
                      href={WEBSITE_URL}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl transition-all flex items-center justify-center gap-2 border border-slate-700"
                    >
                      <span>🌐</span> Ir a Camino Al Inconsciente
                    </a>
                  </div>

                  <button
                    onClick={() => setPaso(1)}
                    className="text-xs text-slate-500 hover:text-slate-400 underline pt-4 block mx-auto"
                  >
                    Realizar otro Escaneo
                  </button>
                </div>
              )}

            </div>
          )}

          {/* Footer Corporativo */}
          <footer className="mt-16 text-center border-t border-slate-800/80 pt-8 pb-4">
            <CaminoLogo className="w-full max-w-xs mx-auto mb-4 opacity-80" />
            <p className="text-xs text-slate-500">
              © {new Date().getFullYear()} Camino Al Inconsciente - Mario Paredes. Todos los derechos reservados.
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
